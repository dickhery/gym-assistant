[package]
name = "gym-assistant"
version = "1.0.0"

[toolchain]
moc = "2.2.1"

[canisters.backend]
main = "src/backend/main.mo"
candid = "src/backend/backend.did"

[canisters.backend.check-stable]
path = "deployed/backend.most"

[canisters.backend.migrations]
chain = "src/backend/migrations"
check-limit = 1

[dependencies]
core = "2.6.2"
